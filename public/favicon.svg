  <rect x="252" y="195" width="22" height="22" rx="3" fill="#0F172A" />
  <rect x="222" y="225" width="22" height="22" rx="3" fill="#0F172A" />
  <rect x="252" y="225" width="22" height="22" rx="3" fill="#0F172A" />

